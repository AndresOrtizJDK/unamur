<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Université de Namur</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/sections.css">
</head>

<body>

    <div class="top-header" id="topheader">
        <nav>
            <div class="elements">
                <ul>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        style="color: white; padding: 8px 6px 8px 12px; cursor: pointer;" width="20" height="20"
                        fill="none" viewBox="0 0 24 24">
                        <path stroke="currentColor" stroke-linecap="round" stroke-width="2"
                            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
                    </svg>
                    <li>Rechercher</li>
                    <li>Annuaire</li>
                    <li>Bibliothèques</li>
                    <li>Soutenir</li>
                    <li>News</li>
                    <li>Agenda</li>
                </ul>
            </div>
            <span class="elements">|</span>
            <div class="lenguaje elements">
                FR
            </div>
        </nav>
    </div>

    <nav class="nav-bar" id="navbar">
        <div class="nav-elements">
            <div class="nav-logo">
                <img src="assets/images/icons/logo.svg" alt="Logo de l'Université de Namur">
            </div>

            <div class="nav-menu">
                <div class="list-element">Études<img class="drop-icon" src="assets/images/icons/drop-icon.svg" alt="">
                </div>
                <div class="list-element">Facultés<img class="drop-icon" src="assets/images/icons/drop-icon.svg" alt="">
                </div>
                <div class="list-element">Vie du campus<img class="drop-icon" src="assets/images/icons/drop-icon.svg"
                        alt=""></div>
                <div class="list-element">La recherche<img class="drop-icon" src="assets/images/icons/drop-icon.svg"
                        alt=""></div>
                <div class="list-element">International<img class="drop-icon" src="assets/images/icons/drop-icon.svg"
                        alt=""></div>
                <div class="list-element">Société<img class="drop-icon" src="assets/images/icons/drop-icon.svg" alt="">
                </div>
                <div class="list-element">Université<img class="drop-icon" src="assets/images/icons/drop-icon.svg"
                        alt=""></div>
            </div>

            <div class="nav-button">
                <button id="button-registration">Inscription</button>
            </div>
        </div>
    </nav>

    <div class="video-section">
        <div class="video-loop">
            <video src="assets/images/videos/home_video.mp4" loop muted></video>
            <div class="welcome">
                <h1>Bienvenue à <br>
                    l'Université de Namur</h1>
            </div>
        </div>
    </div>


    <main>
        <section >
            <span>Accueil</span> / Bienvenue à l'Université de Namur
        </section>

        <div></div>
    </main>

    <footer>

    </footer>

    <script src="assets/js/animations.js"></script>
</body>

</html>
